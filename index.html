<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c4f">
<title>Tischly · Speisekarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#f2f4ef; --card:#ffffff; --ink:#17231e; --muted:#5a6a63; --line:#d8ded6;
  --accent:#1f5c4f; --accent-soft:#e0ece6; --accent-ink:#ffffff;
  --brass:#a3701a; --brass-soft:#f5ead3;
  --good:#2a7a46; --good-soft:#dcefe2; --warn:#b4532a; --warn-soft:#f8e3d8;
  --bezel:#121a16; --shadow:rgba(12,30,24,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101614; --card:#18211d; --ink:#e6ebe7; --muted:#9aaaa2; --line:#2b3732;
  --accent:#63b69f; --accent-soft:#1c322b; --accent-ink:#0b1310;
  --brass:#dcae55; --brass-soft:#382d18;
  --good:#6cc28b; --good-soft:#18301f; --warn:#ef9670; --warn-soft:#3b2318;
  --bezel:#040706; --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}

/* ---------- top bar (presenter only) ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));
  background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.mark{width:26px;height:26px;flex:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;border-radius:9px;padding:7px 13px;font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

/* ---------- layout per view ---------- */
.layout{display:grid;gap:28px;padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));max-width:1240px;margin:0 auto;align-items:start}
body[data-view="vorfuehrung"] .layout{grid-template-columns:390px minmax(0,1fr)}
body[data-view="gast"] .layout{display:block;padding:0;max-width:none}
body[data-view="service"] .layout, body[data-view="inhaber"] .layout{grid-template-columns:minmax(0,1fr);max-width:980px}
body[data-view="service"] .guest-col, body[data-view="inhaber"] .guest-col{display:none}
body[data-view="gast"] .side{display:none}
body.guest-only .bar{display:none}
body[data-view="vorfuehrung"] .g{position:static}
body:not([data-view="vorfuehrung"]) .side-tabs{display:none}
body[data-view="service"] #owner{display:none!important}
body[data-view="inhaber"] #service{display:none!important}
@media (max-width:900px){
  body[data-view="vorfuehrung"] .layout{grid-template-columns:minmax(0,1fr)}
}

/* phone frame only in presenter view */
.phone{position:relative}
body[data-view="vorfuehrung"] .phone{width:100%;max-width:390px;height:min(790px,calc(100vh - 110px));min-height:560px;border:11px solid var(--bezel);border-radius:46px;overflow:hidden;box-shadow:0 34px 70px -34px var(--shadow);margin:0 auto}
body[data-view="vorfuehrung"] .phone .g{height:100%;overflow-y:auto;overscroll-behavior:contain}
body[data-view="vorfuehrung"] .phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:92px;height:22px;border-radius:12px;background:var(--bezel);z-index:20}
.caption{text-align:center;font-size:.82rem;color:var(--muted);margin-top:12px}
body:not([data-view="vorfuehrung"]) .caption{display:none}

/* ---------- guest ---------- */
.g{background:var(--paper);min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
body[data-view="gast"] .g{min-height:100vh;min-height:100dvh}
.g-top{position:sticky;top:0;z-index:10;background:var(--paper);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
body[data-view="vorfuehrung"] .g-top{padding-top:38px}
body[data-view="gast"] .g-top{padding-top:max(14px,env(safe-area-inset-top))}
.g-venue{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g-venue h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.g-table{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.langs{display:flex;gap:6px;margin-top:10px}
.langs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 0;font-family:var(--f-mono);font-size:.82rem;font-weight:500}
.langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:10px 16px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{margin:10px 16px 0;border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.status.wait{background:var(--brass-soft);color:var(--ink)}
.status.coming{background:var(--good-soft);color:var(--good)}
.status small{font-weight:500;color:var(--muted);font-family:var(--f-mono)}
.g-body{flex:1;padding:6px 16px 16px}
.sec{margin-top:16px}
.sec>h2{font-family:var(--f-display);font-weight:600;font-size:1.08rem;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec>h2 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.sec.season>h2{color:var(--brass)}
.lunch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.lunch-today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.lunch-today .day{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.lunch-today h3{font-size:1rem;font-weight:700;margin-top:2px}
.lunch-today p{font-size:.82rem;color:var(--muted)}
.lunch-week{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:8px;font-size:.85rem}
.lunch-week div{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:8px;color:var(--muted)}
.lunch-week div.is-today{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.85rem;justify-self:start}
details.dish{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.season details.dish{border-color:color-mix(in srgb,var(--brass) 40%,var(--line))}
details.dish>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:11px 14px;cursor:pointer}
details.dish>summary::-webkit-details-marker{display:none}
.dish h3{font-size:.98rem;font-weight:700}
.dish .desc{font-size:.84rem;color:var(--muted);line-height:1.35;margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tag{font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 7px}
.tag.s{background:var(--brass-soft);color:var(--brass)}
.tag.v{background:var(--accent-soft);color:var(--accent)}
.tag.x{background:var(--warn-soft);color:var(--warn)}
.codes{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.05em}
.price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92rem;white-space:nowrap}
.dish.sold h3,.dish.sold .price{color:var(--muted);text-decoration:line-through}
.more{padding:0 14px 12px;font-size:.84rem;color:var(--muted);display:grid;gap:4px}
.more b{color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:.88rem;padding:4px 2px 8px}
.g-note{font-size:.74rem;color:var(--muted);text-align:center;padding:4px 16px 12px}
.g-bar{position:sticky;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
body[data-view="gast"] .g-bar{padding-bottom:max(12px,env(safe-area-inset-bottom))}
body[data-view="vorfuehrung"] .g-bar{padding-bottom:18px}
.gbtn{border:0;border-radius:14px;padding:13px 10px;font-weight:700;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn.call{background:var(--accent);color:var(--accent-ink)}
.gbtn.pay{background:var(--ink);color:var(--paper)}
.gbtn:disabled{opacity:.5;cursor:default}
.gbtn svg{width:18px;height:18px;flex:none}
.sheet-bg{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
body[data-view="gast"] .sheet-bg{position:fixed}
.sheet{background:var(--paper);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet h3{font-family:var(--f-display);font-size:1.2rem}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 10px;font-weight:700;font-size:1rem}
.sheet .x{border:0;background:none;color:var(--muted);font-weight:600;padding:8px}
.demo-foot{font-size:.72rem;color:var(--muted);text-align:center;padding:0 16px 10px}
.demo-foot a{color:var(--muted)}

/* ---------- side panels ---------- */
.side{min-width:0;display:grid;gap:14px}
.side-tabs{display:flex;gap:6px}
.side-tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.side-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.badge{background:var(--warn);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px;font-family:var(--f-mono);min-width:20px;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.p-head h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.p-head p{color:var(--muted);font-size:.9rem}
.live{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.88rem}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn.danger{color:var(--warn)}
.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.callc{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--paper)}
.callc.new{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.callc .top{display:flex;justify-content:space-between;align-items:baseline}
.callc .tno{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}
.callc .el{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.callc .el.late{color:var(--warn);font-weight:500}
.callc .what{font-weight:700;font-size:1.05rem}
.callc .meta{font-size:.82rem;color:var(--muted)}
.callc button{border:0;border-radius:10px;padding:10px;font-weight:700}
.callc .ack{background:var(--warn);color:#fff}
.callc .done{background:var(--accent);color:var(--accent-ink)}
.calls-empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.stats b{display:block;font-family:var(--f-display);font-size:1.4rem;color:var(--ink)}
.hint{font-size:.86rem;color:var(--muted);background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:14px}

/* owner */
.o-sec{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.o-sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.o-sec>h3{font-family:var(--f-display);font-weight:600;font-size:1.12rem;margin-bottom:4px}
.o-sec>p.sub{font-size:.86rem;color:var(--muted);margin-bottom:10px}
.tw{overflow-x:auto}
table.ot{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
.ot th{text-align:left;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px;border-bottom:1px solid var(--line)}
.ot td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ot td.n{font-weight:600}
.ot td.n small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.ot input[type=number]{width:86px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:var(--f-mono)}
.ot input[type=checkbox],.form input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.ico{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px;font-weight:600;font-size:.82rem}
.ico:hover{color:var(--ink);background:var(--paper)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:3px;font-size:.82rem;font-weight:600;color:var(--muted)}
.form input[type=text],.form input[type=number],.form select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-weight:400;color:var(--ink)}
.algrid{display:flex;flex-wrap:wrap;gap:6px}
.algrid label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:500;color:var(--ink);font-size:.82rem;cursor:pointer}
.algrid input{width:15px;height:15px;accent-color:var(--accent)}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.lw{display:grid;gap:8px}
.lw-row{display:grid;grid-template-columns:2.6em minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.lw-row span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.lw-row input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:0}
.saved{font-size:.84rem;color:var(--good);min-height:1.4em;margin-top:6px}
.o-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start}
@media (max-width:720px){.o-grid{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:minmax(0,1fr)}}
.tent{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;justify-items:center;gap:4px;text-align:center}
.tent .tv{font-family:var(--f-display);font-weight:800;font-size:1rem}
.tent .qr svg{width:150px;height:150px;display:block}
.tent .tt{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.tent small{font-size:.72rem;color:#333}
.bars{display:grid;gap:6px;font-size:.86rem}
.bars div{display:grid;grid-template-columns:2.2em minmax(0,1fr) 3em;gap:8px;align-items:center}
.bars i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.bars span:last-child{font-family:var(--f-mono);text-align:right;color:var(--muted)}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.kpis div{font-size:.84rem;color:var(--muted)}
.kpis b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.ex{font-family:var(--f-mono);font-size:.68rem;color:var(--brass);background:var(--brass-soft);padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:middle}

/* visit QR overlay */
.ov{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding:24px;text-align:center}
.ov-in{display:grid;gap:14px;justify-items:center;max-width:520px}
.ov h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem)}
.ov p{color:var(--muted)}
.ov .qrbox{background:#fff;padding:14px;border-radius:16px}
.ov .qrbox svg{width:min(70vw,420px);height:min(70vw,420px);display:block}
@media (prefers-reduced-motion:no-preference){.callc.new{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.95)}100%{transform:none}}}
</style>
</head>
<body data-view="vorfuehrung">
<header class="bar" id="bar">
  <div class="brand"><svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 19 L13 6 L19 19" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linejoin="round"/><path d="M5 19h16" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/></svg><span id="brandName">Tischly</span></div>
  <nav class="seg" aria-label="Ansicht">
    <button type="button" data-go="vorfuehrung">Vorführung</button>
    <button type="button" data-go="gast">Gast</button>
    <button type="button" data-go="service">Service <span class="badge" data-badge hidden></span></button>
    <button type="button" data-go="inhaber">Inhaber</button>
  </nav>
</header>

<main class="layout">
  <div class="guest-col">
    <div class="phone"><div class="g" id="guest"></div></div>
    <p class="caption">So sieht es der Gast nach dem Scannen. Keine App, keine Anmeldung.</p>
  </div>
  <div class="side">
    <div class="side-tabs" role="tablist">
      <button type="button" role="tab" id="st-service" aria-selected="true">Service-Ansicht <span class="badge" data-badge hidden></span></button>
      <button type="button" role="tab" id="st-owner" aria-selected="false">Inhaber-Ansicht</button>
    </div>
    <section class="panel" id="service"></section>
    <section class="panel" id="owner" hidden></section>
  </div>
</main>

<div class="ov" id="visit" hidden>
  <div class="ov-in">
    <h2>Bitte scannen Sie mit Ihrem Handy</h2>
    <div class="qrbox" id="visitQr"></div>
    <p id="visitInfo"></p>
    <button type="button" class="tbtn primary" id="visitClose">Fertig, zur Service-Ansicht</button>
  </div>
</div>

  /**

   * @param typeNumber 1 to 40

  var qrcode = function(typeNumber, errorCorrectionLevel) {

/* ---------------- QR ---------------- */
function qrSvg(text, ecl){
  try {
    const q = qrcode(0, ecl || "M"); q.addData(text, "Byte"); q.make();
    const n = q.getModuleCount(), m = 3, size = n + m*2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r,c)) d += "M"+(c+m)+" "+(r+m)+"h1v1h-1z";
    return '<svg viewBox="0 0 '+size+' '+size+'" role="img" aria-label="QR-Code" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';
  } catch(e){ return '<p style="color:#b4532a">QR-Code zu lang. Bitte weniger Gerichte.</p>'; }
}
function baseUrl(){
  if (/^https?:$/.test(location.protocol)) return location.origin + location.pathname;
  return CFG.demoUrl || "";
}

/* ---------------- live relay (ntfy.sh) ---------------- */
const LIVE = {ok:false};
function liveStart(){
  if (!CFG.room || !("EventSource" in window)) return;
  try {
    const es = new EventSource("https://ntfy.sh/" + encodeURIComponent(CFG.room) + "/sse");
    es.onopen = () => { LIVE.ok = true; renderLive(); };
    es.onerror = () => { LIVE.ok = false; renderLive(); };
    es.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.event && m.event !== "message") return;
        const p = JSON.parse(m.message);
        if (!p || p.from === CLIENT) return;
        onMsg(p);
      } catch(err){}
    };
  } catch(e){}
}
function send(p){
  p.from = CLIENT;
  onMsg(p);
  if (!CFG.room) return;
  try { fetch("https://ntfy.sh/" + encodeURIComponent(CFG.room), {method:"POST", body:JSON.stringify(p)}).catch(()=>{}); } catch(e){}
}
function onMsg(p){
  if (p.k === "req"){
    if (S.reqs.some(r => r.id === p.id)) return;
    S.reqs.push({id:p.id, table:p.table, type:p.type, pay:p.pay, lang:p.lang, ts:p.ts || now(), status:"new"});
    beep();
  } else {
    const r = S.reqs.find(x => x.id === p.id);
    if (r){
      if (p.k === "ack" && r.status === "new"){ r.status = "ack"; r.ackTs = p.ts || now(); }
      if (p.k === "done"){ r.status = "done"; r.doneTs = p.ts || now(); if (!r.ackTs) r.ackTs = r.doneTs; }
    }
    if (S.mine && S.mine.id === p.id){
      if (p.k === "ack") S.mine.status = "coming";
      if (p.k === "done") S.mine = null;
      renderGuest();
    }
  }
  renderService(); renderBadges(); if (S.view === "inhaber" || S.sideTab === "owner") renderStatsOnly();
}
let actx = null;
function beep(){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = t ? 1046 : 784;
      g.gain.setValueAtTime(0.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.16);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.18);
    });
  } catch(e){}
  if (navigator.vibrate) try { navigator.vibrate([120,60,120]); } catch(e){}
}

function mmss(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function avgReaction(){
  const a = S.reqs.filter(r => r.ackTs);
  if (!a.length) return null;
  return a.reduce((s,r) => s + (r.ackTs - r.ts), 0) / a.length;
}

    const what = r.type === "bill" ? "Möchte zahlen" + (r.pay ? " · " + (r.pay === "card" ? "Karte" : "Bar") : "") : "Ruft den Kellner";
    const btn = r.status === "new" ? '<button type="button" class="ack" data-ack="'+r.id+'">Ich komme</button>' : '<button type="button" class="done" data-done="'+r.id+'">Erledigt</button>';

    '<input type="text" id="lw-de-'+i+'" data-lw="'+i+'" data-l="de" value="'+esc((L.days[i]&&L.days[i].de)||"")+'" placeholder="Gericht auf Deutsch" aria-label="'+UI.de.days[i]+' Deutsch">'+
    '<input type="text" id="lw-en-'+i+'" data-lw="'+i+'" data-l="en" value="'+esc((L.days[i]&&L.days[i].en)||"")+'" placeholder="auf Englisch" aria-label="'+UI.de.days[i]+' Englisch"></div>').join("");
  const tableOpts = Array.from({length:S.tables}, (_,k) => '<option value="'+(k+1)+'"'+(S.tentTable===k+1?' selected':'')+'>Tisch '+(k+1)+'</option>').join("");
  $("owner").innerHTML =
    '<div class="p-head"><div><h2>Inhaber</h2><p>Alles, was Sie täglich ändern. Jede Änderung ist sofort auf allen Tischen.</p></div>'+
    '<button type="button" class="tbtn primary" data-visit="1">Besuchs-QR zeigen</button></div>'+
    '<div class="o-sec"><h3>Heute</h3><p class="sub">Preis anpassen, „heute aus“ markieren, Gericht in die Saisonkarte schieben.</p>'+
    '<div class="tw"><table class="ot"><thead><tr><th>Gericht</th><th>Preis €</th><th>Heute aus</th><th>Saison</th><th></th></tr></thead><tbody>'+
    S.items.map(itemRow).join("")+'</tbody></table></div><div class="saved" id="savedMsg" aria-live="polite"></div></div>'+
    '<div class="o-sec"><h3>'+(S.editId?'Gericht bearbeiten':'Neues Gericht')+'</h3><p class="sub">Gericht anlegen wie auf der Papierkarte. Allergene einmal ankreuzen, der Gast sieht sie in seiner Sprache.</p>'+formHTML()+'</div>'+
    '<div class="o-sec"><h3>Mittagsmenü der Woche</h3><p class="sub">Einmal pro Woche eintragen. Der Gast sieht automatisch das Gericht von heute.</p>'+
    '<div class="lw">'+lunchRows+'<label class="form" style="display:flex;gap:8px;align-items:center;font-size:.86rem;font-weight:600;color:var(--muted)">Preis Menü €<input type="number" id="lw-price" step="0.1" min="0" value="'+Number(L.price).toFixed(2)+'" style="width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:var(--f-mono)"></label></div></div>'+
    '<div class="o-sec"><h3>Gäste und Sprachen</h3><div id="ownerStats">'+statsHTML()+'</div></div>'+
    '<div class="o-sec"><div class="o-grid"><div><h3>Lokal und Tische</h3><p class="sub">Name des Lokals und Anzahl der Tische. Jeder Tisch bekommt seinen eigenen QR-Code.</p>'+
    '<div class="form"><label>Name des Lokals<input type="text" id="o-venue" value="'+esc(S.venue)+'"></label><label>Anzahl Tische<input type="number" id="o-tables" min="1" max="99" value="'+S.tables+'"></label>'+
    '<label>Vorschau für<select id="o-tent">'+tableOpts+'</select></label></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button type="button" class="tbtn" data-clear="1">Beispielgerichte entfernen</button><button type="button" class="tbtn danger" data-reset="1">Vorführung zurücksetzen</button></div>'+
    '<p class="saved" id="resetMsg" aria-live="polite"></p></div>'+
    '<div class="tent" aria-label="Vorschau Tischaufsteller"><span class="tv">'+esc(S.venue)+'</span><div class="qr">'+qrSvg(baseUrl()+"#gast-"+S.tentTable)+'</div><span class="tt">Tisch '+S.tentTable+'</span><small>Speisekarte · Menu · Menù · Menú</small><small>Scannen · Scan · Inquadra · Escanea</small></div></div></div>';
}
let savedT;
function savedMsg(t){ const el = $("savedMsg"); if (!el) return; el.textContent = t; clearTimeout(savedT); savedT = setTimeout(() => { el.textContent = ""; }, 3000); }
let resetArmed = false, clearArmed = false;
$("owner").addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.price){ const v = parseFloat(el.value); if (!isNaN(v) && v >= 0){ byId(el.dataset.price).price = v; persist(); renderGuest(); savedMsg("Gespeichert. Der neue Preis steht schon auf der Karte."); } }
  if (el.dataset.lw){ const i = el.dataset.lw; S.lunch.days[i] = S.lunch.days[i] || {al:"", veg:0}; S.lunch.days[i][el.dataset.l] = el.value; persist(); renderGuest(); }
  if (el.id === "lw-price"){ const v = parseFloat(el.value); if (!isNaN(v) && v >= 0){ S.lunch.price = v; persist(); renderGuest(); } }
  if (el.id === "o-venue"){ S.venue = el.value || "Mein Lokal"; persist(); renderGuest(); const tv = document.querySelector(".tent .tv"); if (tv) tv.textContent = S.venue; }
});
$("owner").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.sold){ byId(el.dataset.sold).sold = el.checked ? 1 : 0; persist(); renderGuest(); savedMsg(el.checked ? "Als „heute aus“ markiert. Gäste sehen es sofort." : "Wieder verfügbar."); }
  if (el.dataset.season){ byId(el.dataset.season).season = el.checked ? 1 : 0; persist(); renderGuest(); savedMsg(el.checked ? "Steht jetzt oben in der Saisonkarte." : "Aus der Saisonkarte genommen."); }
  if (el.id === "o-tables"){ const n = Math.max(1, Math.min(99, parseInt(el.value,10) || 1)); S.tables = n; if (S.tentTable > n) S.tentTable = n; if (S.table > n) S.table = 1; persist(); renderOwner(); renderGuest(); }
  if (el.id === "o-tent"){ S.tentTable = parseInt(el.value,10) || 1; renderOwner(); }
});
$("owner").addEventListener("submit", e => {
  e.preventDefault();
  const nde = $("f-nde").value.trim(), price = parseFloat($("f-price").value);
  if (!nde || isNaN(price)) return;
  const al = AL_KEYS.filter(k => $("f-al-"+k).checked).join("");
  const data = {cat:$("f-cat").value, price, al, veg:$("f-veg").checked?1:0, season:$("f-season").checked?1:0,
    n:{de:nde, en:$("f-nen").value.trim() || nde}, d:{de:$("f-dde").value.trim(), en:$("f-den").value.trim() || $("f-dde").value.trim()}};
  if (S.editId){ const it = byId(S.editId); const keepSold = it.sold; Object.assign(it, data); it.sold = keepSold; delete it.ref; S.editId = null; }
  else S.items.push(Object.assign({id:"x"+now().toString(36)}, data));
  persist(); renderOwner(); renderGuest(); savedMsg("Gespeichert.");
});
$("owner").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit){ S.editId = b.dataset.edit; renderOwner(); const f = $("dishForm"); if (f) f.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if (b.dataset.cancelEdit){ S.editId = null; renderOwner(); return; }
  if (b.dataset.del){ S.items = S.items.filter(i => i.id !== b.dataset.del); persist(); renderOwner(); renderGuest(); return; }
  if (b.dataset.visit){ showVisit(); return; }
  if (b.dataset.clear){
    if (!clearArmed){ clearArmed = true; b.textContent = "Wirklich alle Beispielgerichte entfernen?"; setTimeout(() => { clearArmed = false; if (b.isConnected) b.textContent = "Beispielgerichte entfernen"; }, 4000); return; }
    clearArmed = false; S.items = S.items.filter(i => !DEF_BY_ID[i.id]); S.lunch = {price:S.lunch.price, days:{}}; persist(); renderOwner(); renderGuest(); return;
  }
  if (b.dataset.reset){
    if (!resetArmed){ resetArmed = true; b.textContent = "Nochmal tippen zum Zurücksetzen"; setTimeout(() => { resetArmed = false; if (b.isConnected) b.textContent = "Vorführung zurücksetzen"; }, 4000); return; }
    resetArmed = false; store.del(KEY);
    S.items = clone(DEFAULT_ITEMS); S.lunch = clone(DEFAULT_LUNCH); S.venue = (CFG.demoVenue && CFG.demoVenue.name) || "Café Muster"; S.tables = (CFG.demoVenue && CFG.demoVenue.tables) || 12;
    renderOwner(); renderGuest(); const m = $("resetMsg"); if (m) m.textContent = "Zurückgesetzt auf die Beispielkarte."; return;
  }
});

/* ---------------- visit QR: carries the prepared menu to the owner's phone ---------------- */
function packMenu(){
  const items = S.items.map(i => {
    const d = DEF_BY_ID[i.id];
    if (d && !i.ref && JSON.stringify(d.n) === JSON.stringify(i.n) && JSON.stringify(d.d) === JSON.stringify(i.d) && d.al === i.al && d.cat === i.cat && d.veg === i.veg)
      return [i.id, i.price, i.sold?1:0, i.season?1:0];
    return {c:i.cat, p:i.price, a:i.al, v:i.veg?1:0, z:i.season?1:0, x:i.sold?1:0, n:i.n, d:i.d};
  });
  const lunchSame = JSON.stringify(S.lunch.days) === JSON.stringify(DEFAULT_LUNCH.days);
  return {v:S.venue, t:S.table, i:items, l: lunchSame ? {p:S.lunch.price} : {p:S.lunch.price, d:S.lunch.days}};
}
function unpackMenu(o){
  S.venue = o.v || S.venue; S.table = o.t || 5;
  S.items = (o.i || []).map((e, k) => {
    if (Array.isArray(e)){ const d = clone(DEF_BY_ID[e[0]] || {}); if (!d.id) return null; d.price = e[1]; d.sold = e[2]; d.season = e[3]; return d; }
    return {id:"v"+k, cat:e.c, price:e.p, al:e.a||"", veg:e.v, season:e.z, sold:e.x, n:e.n||{de:"?"}, d:e.d||{}};
  }).filter(Boolean);
  S.lunch = {price: o.l && o.l.p != null ? o.l.p : DEFAULT_LUNCH.price, days: o.l && o.l.d ? o.l.d : clone(DEFAULT_LUNCH.days)};
}
const b64u = {
  enc(bytes){ let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec(str){ const s = atob(str.replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s, c => c.charCodeAt(0)); }
};
async function encodeMenu(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ("CompressionStream" in window){
    try { const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "z" + b64u.enc(new Uint8Array(await new Response(cs).arrayBuffer())); } catch(e){}
  }
  return "j" + b64u.enc(raw);
}
async function decodeMenu(s){
  const bytes = b64u.dec(s.slice(1));
  if (s[0] === "z"){ const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(ds).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function showVisit(){
  const data = await encodeMenu(packMenu());
  const url = baseUrl() + "#besuch=" + data;
  $("visitQr").innerHTML = qrSvg(url, "L");
  $("visitQr").dataset.url = url;
  $("visitInfo").textContent = "Ihre Karte von „" + S.venue + "“ öffnet sich auf Ihrem Handy, an Tisch " + S.table + ". Tippen Sie dort auf „Kellner rufen“ und schauen Sie auf dieses Gerät." + (url.length > 1800 ? " Hinweis: sehr viele Gerichte, der Code ist dicht. Bei Problemen ein paar Gerichte entfernen." : "");
  $("visit").hidden = false;
}
$("visitClose").addEventListener("click", () => { $("visit").hidden = true; go("service"); });

/* ---------------- views ---------------- */
function go(v){ location.hash = v; }
function applyView(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  let v = "vorfuehrung";
  const mGast = /^gast(?:-(\d{1,2}))?$/.exec(h);
  if (mGast){ v = "gast"; if (mGast[1]) { S.table = parseInt(mGast[1],10); S.guestOnly = true; } }
  else if (h === "service" || h === "inhaber" || h === "vorfuehrung") v = h;
  else if (h.indexOf("besuch=") === 0) v = "gast";
  S.view = v;
  document.body.dataset.view = v;
  document.body.classList.toggle("guest-only", S.guestOnly && v === "gast");
  document.querySelectorAll("[data-go]").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === v)));
  if (v === "service"){ $("service").hidden = false; $("owner").hidden = true; }
  else if (v === "inhaber"){ $("owner").hidden = false; $("service").hidden = true; renderOwner(); }
  else if (v === "vorfuehrung"){ setSide(S.sideTab); }
  renderGuest(); window.scrollTo(0,0);
}
function setSide(t){
  S.sideTab = t;
  $("st-service").setAttribute("aria-selected", String(t === "service"));
  $("st-owner").setAttribute("aria-selected", String(t === "owner"));
  $("service").hidden = t !== "service"; $("owner").hidden = t !== "owner";
  if (t === "owner") renderOwner();
}
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
$("st-service").addEventListener("click", () => setSide("service"));
$("st-owner").addEventListener("click", () => setSide("owner"));
window.addEventListener("hashchange", applyView);

/* ---------------- boot ---------------- */
(async function boot(){
  const h = location.hash.replace(/^#/, "");
  if (h.indexOf("besuch=") === 0){
    try { unpackMenu(await decodeMenu(h.slice(7))); S.guestOnly = true; } catch(e){}
  }
  if (S.guestOnly){
    // guests start in the language of their phone
    const pl = (navigator.language || "de").slice(0,2).toLowerCase();
    if (LANGS.includes(pl)) S.lang = pl;
  }
  applyView(); renderService(); renderBadges(); liveStart();
})();
})();
</script>
